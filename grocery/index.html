<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="買菜記帳">
<meta name="theme-color" content="#eef1f6">
<title>阿母買菜記帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* 版面：一個畫面的 APP，上面對話、下面固定一顆大麥克風；字一律放大給長輩看 */
:root {
  --bg: #eef1f6;          /* 淡藍灰底 */
  --paper: #ffffff;       /* 機器人泡泡、卡片 */
  --ink: #18212e;         /* 主要文字 */
  --muted: #566274;       /* 次要文字 */
  --line: #d3d9e3;
  --ai: #23407a;          /* 藍：使用者泡泡、選取 */
  --ai-ink: #ffffff;
  --mic: #cf3b22;         /* 朱紅：麥克風 */
  --mic-ink: #ffffff;
  --yes: #1d7a4c;
  --no: #b3261e;
  --tint: #e2e8f3;
  --font: "Noto Sans TC", "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11161f; --paper: #1b2330; --ink: #eef2f7; --muted: #a3afc0; --line: #2d3848;
    --ai: #5d85d6; --ai-ink: #0c1220; --mic: #f06a4f; --mic-ink: #1a0c08;
    --yes: #4cc48a; --no: #f2867d; --tint: #232d3d; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 20px; line-height: 1.5; -webkit-text-size-adjust: 100%;
  font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--ai); outline-offset: 2px; }
[hidden] { display: none !important; }

.app {
  height: 100%; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  max-width: 640px; margin: 0 auto;
}
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 8px; }
header h1 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: .04em; }
.owner {
  border: 2px solid var(--line); background: var(--paper); border-radius: 999px;
  padding: 6px 16px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px;
}
.owner small { color: var(--muted); font-weight: 500; font-size: 15px; }

.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-block: 4px 10px; }
.tabs button {
  border: 0; border-radius: 14px; padding: 12px 8px; font-size: 21px; font-weight: 700;
  background: var(--tint); color: var(--muted); position: relative;
}
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.badge { display: inline-block; min-width: 1.4em; margin-left: 6px; font-size: 15px; border-radius: 999px; background: var(--mic); color: var(--mic-ink); padding: 0 6px; }
.badge:empty { display: none; }

/* ---- 對話 ---- */
#view-talk { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-block: 8px 12px; -webkit-overflow-scrolling: touch; }
.msg { max-width: 86%; padding: 12px 16px; border-radius: 20px; font-size: 22px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
.msg.bot { align-self: flex-start; background: var(--paper); border: 2px solid var(--line); border-bottom-left-radius: 6px; }
.msg.me { align-self: flex-end; background: var(--ai); color: var(--ai-ink); border-bottom-right-radius: 6px; font-weight: 700; }
.msg.me.tap { opacity: .85; font-weight: 500; }
.msg.me.live { opacity: .6; }
.card { width: 86%; display: flex; flex-direction: column; gap: 4px; white-space: normal; }
.cd-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 17px; color: var(--muted); }
.cd-item { font-size: 26px; font-weight: 900; }
.cd-amt { font-size: 34px; font-weight: 900; letter-spacing: .01em; }
.cd-row { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 6px; font-size: 19px; }
.cd-row span { color: var(--muted); flex: none; }
.cd-row b { text-align: right; }
.cd-q { font-weight: 700; margin-top: 6px; }
.cat { display: inline-block; font-size: 15px; font-weight: 700; padding: 1px 10px; border-radius: 999px; background: var(--tint); color: var(--ink); }
.cat.sm { font-size: 13px; padding: 0 8px; margin-right: 8px; vertical-align: 2px; }

#chips { display: flex; flex-wrap: wrap; gap: 10px; padding-block: 0 10px; }
#chips:empty { display: none; }
.chip { border: 2px solid var(--ai); background: var(--paper); color: var(--ai); border-radius: 16px; padding: 10px 18px; font-size: 21px; font-weight: 700; min-height: 54px; }
.chip.strong { background: var(--ai); color: var(--ai-ink); }
.chip.on { background: var(--ai); color: var(--ai-ink); }
.chip.yes { background: var(--yes); border-color: var(--yes); color: #fff; flex: 1 1 60%; font-size: 24px; min-height: 64px; }
.chip.no { border-color: var(--no); color: var(--no); flex: 1 1 30%; font-size: 24px; min-height: 64px; }
.chip.quiet { border-color: var(--line); color: var(--muted); }

.dock { border-top: 2px solid var(--line); background: var(--bg); padding-block: 14px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 10px; }
#talkBtn {
  width: 100%; min-height: 96px; border: 0; border-radius: 28px; background: var(--mic); color: var(--mic-ink);
  display: flex; align-items: center; justify-content: center; gap: 16px; font-size: 28px; font-weight: 900; letter-spacing: .06em;
  box-shadow: 0 6px 0 color-mix(in srgb, var(--mic) 60%, #000);
  transition: transform .1s;
}
#talkBtn:active { transform: translateY(3px); box-shadow: 0 3px 0 color-mix(in srgb, var(--mic) 60%, #000); }
#talkBtn svg { width: 44px; height: 44px; flex: none; }
#mic { width: 100%; min-height: 52px; border: 2px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 16px; font-size: 18px; font-weight: 700; }
#mic.on { background: var(--mic); border-color: var(--mic); color: var(--mic-ink); }
#mic.on { animation: pulse 1.2s ease-in-out infinite; }
#mic.prep { background: var(--tint); color: var(--ink); }
@keyframes pulse { 50% { filter: brightness(1.18); } }
@media (prefers-reduced-motion: reduce) { #mic.on { animation: none; outline: 4px solid var(--ink); } }
#compose { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.dict-hint { margin: 0; text-align: center; font-size: 21px; font-weight: 700; line-height: 1.5; }
.dict-hint small { font-size: 16px; color: var(--muted); font-weight: 500; }
.dict-hint .key { display: inline-flex; vertical-align: -6px; width: 34px; height: 34px; align-items: center; justify-content: center; border-radius: 8px; background: var(--paper); border: 2px solid var(--ink); }
.dict-hint .key svg { width: 22px; height: 22px; }
#typeBox { width: 100%; font: inherit; font-size: 24px; line-height: 1.4; padding: 12px 14px; border-radius: 16px; border: 3px solid var(--ai); background: var(--paper); color: var(--ink); resize: none; min-height: 3.6em; }
.compose-acts { display: flex; gap: 10px; }

/* ---- 帳本 ---- */
#view-book { flex: 1; overflow-y: auto; padding-block: 4px calc(24px + env(safe-area-inset-bottom, 0px)); }
.sec-h { font-size: 22px; margin: 18px 0 8px; font-weight: 900; }
.sum-block { background: var(--paper); border: 2px solid var(--line); border-radius: 18px; padding: 12px 16px; margin-bottom: 12px; }
.sum-block h3 { margin: 0 0 6px; font-size: 18px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 20px; }
th { text-align: right; color: var(--muted); font-weight: 500; font-size: 15px; padding: 4px 0; }
th:first-child, td:first-child { text-align: left; }
td { text-align: right; padding: 6px 0; border-top: 1px solid var(--line); font-weight: 700; }
.settle { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.settle li { background: var(--tint); border-radius: 12px; padding: 8px 12px; font-size: 20px; }
.even { margin: 8px 0 0; color: var(--muted); }
.day { font-size: 17px; color: var(--muted); margin: 16px 0 6px; font-weight: 700; }
.entry { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "main amt" "main del"; gap: 2px 12px; background: var(--paper); border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; margin-bottom: 8px; }
.e-main { grid-area: main; min-width: 0; }
.e-item { font-size: 21px; font-weight: 700; }
.e-meta { font-size: 16px; color: var(--muted); }
.e-amt { grid-area: amt; text-align: right; font-size: 21px; font-weight: 900; }
.e-acts { grid-area: del; justify-self: end; display: flex; gap: 8px; }
.e-acts button { border: 2px solid var(--line); background: transparent; border-radius: 12px; padding: 4px 14px; font-size: 17px; color: var(--muted); min-height: 40px; }
.e-acts .e-edit { border-color: var(--ai); color: var(--ai); font-weight: 700; }
.e-del.armed { border-color: var(--no); color: var(--no); font-weight: 700; }

.search { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 8px; padding-block: 4px 10px; }
.search svg { position: absolute; left: 14px; width: 22px; height: 22px; color: var(--muted); pointer-events: none; }
#searchBox { flex: 1; min-width: 0; font: inherit; font-size: 19px; padding: 12px 14px 12px 44px; border-radius: 16px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); -webkit-appearance: none; appearance: none; }
#searchClear { border: 2px solid var(--line); background: var(--paper); border-radius: 14px; padding: 0 14px; min-height: 50px; font-size: 17px; font-weight: 700; color: var(--muted); }
.found { margin: 4px 0 0; font-weight: 700; color: var(--ai); }

.entry.editing { display: flex; flex-direction: column; gap: 12px; border-color: var(--ai); padding: 14px; }
.fld { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.fld > span { font-size: 15px; color: var(--muted); font-weight: 700; }
.fld.narrow { flex: 0 0 7.5em; }
.fld-row { display: flex; gap: 10px; flex-wrap: wrap; }
.fld input, .fld select { font: inherit; font-size: 20px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; min-width: 0; }
.picks { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { border: 2px solid var(--ai); background: var(--paper); color: var(--ai); border-radius: 14px; padding: 8px 16px; font-size: 20px; font-weight: 700; min-height: 48px; }
.pick.on { background: var(--ai); color: var(--ai-ink); }
.ed-err { margin: 0; color: var(--no); font-weight: 700; }
.ed-acts { display: flex; gap: 10px; }
.ed-save { flex: 2; border: 0; border-radius: 14px; background: var(--yes); color: #fff; font-size: 22px; font-weight: 900; min-height: 56px; }
.ed-cancel { flex: 1; border: 2px solid var(--line); background: transparent; border-radius: 14px; font-size: 20px; color: var(--muted); min-height: 56px; }
.empty { color: var(--muted); }
.share { width: 100%; border: 0; border-radius: 18px; background: var(--ai); color: var(--ai-ink); font-size: 22px; font-weight: 900; padding: 16px; margin-top: 8px; }
#copyBox { width: 100%; height: 140px; margin-top: 10px; font-size: 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); padding: 8px; }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; background: var(--paper); border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; }
.setting select { font: inherit; font-size: 19px; padding: 6px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
.hint { font-size: 15px; color: var(--muted); margin-top: 18px; }

#flash { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 16px; font-size: 19px; text-align: center; z-index: 20; }

#exportSheet { position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 92%, transparent); display: flex; align-items: flex-end; justify-content: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet.export { max-width: 560px; max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.sheet.export h2 { margin: 0; }
.range-list { display: flex; flex-wrap: wrap; gap: 10px; }
.pv-h { margin: 4px 0 0 !important; font-size: 16px !important; }
#exportPreview { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--font); font-size: 16px; line-height: 1.55; background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: 12px; max-height: 40vh; overflow-y: auto; }

/* ---- 麥克風檢查 ---- */
.diag-btn { width: 100%; margin-top: 18px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 16px; padding: 12px; font-size: 19px; font-weight: 700; }
#diag { margin: 10px 0 0; white-space: pre-wrap; word-break: break-all; font-size: 14px; line-height: 1.5; background: var(--paper); border: 2px solid var(--line); border-radius: 12px; padding: 10px; font-family: ui-monospace, Menlo, monospace; }

/* ---- 第一次：這支手機是誰的 ---- */
#ownerSheet { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 92%, transparent); z-index: 30; display: flex; align-items: center; justify-content: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--paper); border: 2px solid var(--line); border-radius: 24px; padding: 24px 20px; width: 100%; max-width: 420px; }
.sheet h2 { margin: 0 0 4px; font-size: 28px; font-weight: 900; text-wrap: balance; }
.sheet p { margin: 0 0 16px; color: var(--muted); font-size: 18px; }
#ownerList { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.owner-btn { border: 2px solid var(--ai); background: var(--paper); color: var(--ai); border-radius: 18px; min-height: 80px; font-size: 28px; font-weight: 900; }
.owner-btn.on { background: var(--ai); color: var(--ai-ink); }
</style>
</head>
<body>
<div class="app">
  <header class="gut">
    <h1>買菜記帳</h1>
    <button type="button" class="owner" id="ownerBtn" aria-label="更換手機主人"><small>這是</small><span id="ownerName">—</span><small>的手機</small></button>
  </header>
  <nav class="tabs gut" role="tablist">
    <button type="button" id="tab-talk" role="tab" aria-selected="true">說話記帳</button>
    <button type="button" id="tab-book" role="tab" aria-selected="false">帳本<span class="badge" id="countBadge"></span></button>
  </nav>

  <section id="view-talk">
    <div id="chat" class="gut" aria-live="polite"></div>
    <div id="chips" class="gut"></div>
    <div class="dock gut">
      <form id="compose" autocomplete="off" hidden>
        <p class="dict-hint">按鍵盤上的 <span class="key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5" fill="currentColor" stroke="none"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3.5"/></svg></span> 就可以用說的<br><small>說完按「送出」</small></p>
        <textarea id="typeBox" rows="2" enterkeyhint="send" placeholder="例如：全聯買菜八百五" aria-label="要記的帳"></textarea>
        <div class="compose-acts">
          <button type="submit" class="ed-save">送出</button>
          <button type="button" id="composeCancel" class="ed-cancel">收起來</button>
        </div>
      </form>
      <button type="button" id="talkBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5" fill="currentColor" stroke="none"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3.5"/></svg><span>按這裡說話</span></button>
      <button type="button" id="mic" aria-pressed="false"><span id="micLabel">快速語音（有時不穩）</span></button>
    </div>
  </section>

  <section id="view-book" class="gut" hidden>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
      <input id="searchBox" type="search" placeholder="搜尋：全聯、阿姨、MOMO、10/26" aria-label="搜尋記帳" autocomplete="off">
      <button type="button" id="searchClear" hidden aria-label="清除搜尋">清除</button>
    </div>
    <div id="ledgerList"></div>
    <h2 class="sec-h">誰要給誰（全部記帳）</h2>
    <div id="summary"></div>
    <button type="button" class="share" id="shareBtn">把帳本傳給家人（LINE）</button>
    <textarea id="copyBox" readonly hidden aria-label="帳本文字"></textarea>
    <label class="setting" for="pause"><span>停多久才算說完</span>
      <select id="pause"><option value="1.5">1.5 秒</option><option value="2.5">2.5 秒</option><option value="4">4 秒</option><option value="6">6 秒</option></select>
    </label>
    <button type="button" class="diag-btn" id="diagBtn">麥克風檢查</button>
    <pre id="diag" hidden></pre>
    <p class="hint">說話時也可以再按一次紅色按鈕，馬上結束。帳本只存在這支手機裡，旅行結束前記得按上面的按鈕傳給家人備份。</p>
  </section>
</div>
<div id="flash" hidden role="status"></div>

<div id="exportSheet" hidden>
  <div class="sheet export">
    <h2>要傳哪一段？</h2>
    <div id="rangeList" class="range-list"></div>
    <div id="customRange" class="fld-row" hidden>
      <label class="fld" for="rangeFrom"><span>從</span><input id="rangeFrom" type="date"></label>
      <label class="fld" for="rangeTo"><span>到</span><input id="rangeTo" type="date"></label>
    </div>
    <p class="pv-h">會傳出這些內容：</p>
    <pre id="exportPreview"></pre>
    <div class="ed-acts">
      <button type="button" id="exportSend" class="ed-save">傳到 LINE</button>
      <button type="button" id="exportCancel" class="ed-cancel">取消</button>
    </div>
  </div>
</div>

<div id="ownerSheet" hidden>
  <div class="sheet">
    <h2>這支手機是誰的？</h2>
    <p>說「我」的時候，就會記在這個人身上。</p>
    <div id="ownerList"></div>
  </div>
</div>

<script>
// ===== 句子理解（不用 AI，用規則） =====
var DEFAULT_MEMBERS = [
  { name: '阿母', alias: ['阿母', '媽媽', '老媽', '母親', '媽'] },
  { name: '阿姐', alias: ['阿姐', '阿姊', '姐姐', '姊姊', '大姐', '姐', '姊'] },
  { name: '阿弟', alias: ['阿弟', '弟弟', '小弟', '弟'] },
  { name: '阿杯', alias: ['阿杯', '阿伯', '阿北', '阿爸', '爸爸', '老爸', '爸'] },
  { name: '阿姨', alias: ['阿姨', '小阿姨', '姨'] }
];

var HOUSE = ['阿母', '阿姐', '阿弟']; // 「我們家」= 這三個人

var CN_DIGIT = { '零': 0, '〇': 0, '一': 1, '二': 2, '兩': 2, '两': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };
var CN_UNIT = { '十': 10, '百': 100, '千': 1000 };

function toHalfWidth(s) {
  return s.replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
}

// 「兩千四」→2400、「一萬二」→12000、「三百五」→350、「2千4」→2400
function cnToNum(raw) {
  var s = raw.replace(/[,，]/g, '');
  if (/^\d+$/.test(s)) return parseInt(s, 10);
  var total = 0, section = 0, num = 0, lastUnit = 0, zero = false, digitRun = false;
  for (var i = 0; i < s.length; i++) {
    var ch = s[i];
    if (/\d/.test(ch)) {
      num = digitRun ? num * 10 + (+ch) : +ch; digitRun = true; continue;
    }
    digitRun = false;
    if (ch === '零' || ch === '〇') { zero = true; continue; }
    if (CN_DIGIT[ch] !== undefined) { num = CN_DIGIT[ch]; continue; }
    if (CN_UNIT[ch]) {
      var u = CN_UNIT[ch];

      section += num * u; num = 0; lastUnit = u; zero = false; continue;
    }
    if (ch === '萬' || ch === '万') {
      section += num; total += section * 10000; section = 0; num = 0; lastUnit = 10000; zero = false; continue;
    }

  if (num > 0 && num < 10 && !zero && lastUnit >= 100) section += num * lastUnit / 10;
  else section += num;
  return total + section;
}

var NUM_CHARS = '0-9零〇一二兩两三四五六七八九十百千萬万,，';
var COUNTER = '個|个|盒|瓶|包|張|人|杯|碗|份|件|罐|條|支|位|次|點|号|號|月|天|分|樣|袋|台|雙|片|顆|晚|間|歲|樓|站|起|下|些|直';
var MONEY_UNIT = '元|塊錢|塊|圓|円|日幣|日圓|日元|台幣|新台幣';

function findAmounts(text) {
  var re = new RegExp('([' + NUM_CHARS + ']+)\\s*(' + MONEY_UNIT + '|' + COUNTER + ')?', 'g');
  var out = [], m;
  while ((m = re.exec(text))) {
    var digits = m[1].replace(/^[,，]+|[,，]+$/g, '');
    if (!digits) continue;
    var unit = m[2] || '';
    if (unit && new RegExp('^(' + COUNTER + ')$').test(unit)) {
      // 「一千八四個人」：前面是金額，最後一個字是人數
      if (digits.length >= 3 && /[十百千萬万]/.test(digits.slice(0, -1)) && CN_DIGIT[digits.slice(-1)] !== undefined) {
        var pre = digits.slice(0, -1);
        out.push({ value: cnToNum(pre), start: m.index, end: m.index + pre.length, unit: '' });
      }
      continue; // 兩個、四個人、三點
    }
    var v = cnToNum(digits);
    if (!v) continue;
    if (!unit && v < 10 && /^[一二兩两三四五六七八九十]$/.test(digits)) continue; // 「一起」「十分」這類
    out.push({ value: v, start: m.index, end: m.index + m[0].length, unit: unit });

}

function memberAliases(members) {

// 在句子裡找人名，回傳 [{name, start, end}]
function findPeople(text, members, owner) {
  var found = [];

  function mark(s, e) { for (var i = s; i < e; i++) used[i] = true; }
  function free(s, e) { for (var i = s; i < e; i++) if (used[i]) return false; return true; }
  ['我們家', '我家', '自己家'].forEach(function (g) {
    var idx = -1;
    while ((idx = text.indexOf(g, idx + 1)) >= 0) {
      if (free(idx, idx + g.length)) { found.push({ name: '*HOUSE*', start: idx, end: idx + g.length }); mark(idx, idx + g.length); }

  var groups = ['我們全部', '我們大家', '我們', '大家', '全部的人', '全部', '所有人', '五個人', '一起'];
  groups.forEach(function (g) {

    while ((idx = text.indexOf(g, idx + 1)) >= 0) {
      if (free(idx, idx + g.length)) { found.push({ name: '*ALL*', start: idx, end: idx + g.length }); mark(idx, idx + g.length); }
    }
  });
  memberAliases(members).forEach(function (x) {
    var idx = -1;
    while ((idx = text.indexOf(x.a, idx + 1)) >= 0) {
      if (free(idx, idx + x.a.length)) { found.push({ name: x.name, start: idx, end: idx + x.a.length }); mark(idx, idx + x.a.length); }
    }
  });
  ['自己', '我'].forEach(function (p) {
    var idx = -1;
    while ((idx = text.indexOf(p, idx + 1)) >= 0) {
      if (free(idx, idx + p.length) && owner) { found.push({ name: owner, start: idx, end: idx + p.length, self: true }); mark(idx, idx + p.length); }
    }
  });
  found.sort(function (a, b) { return a.start - b.start; });

}

var CATS = [

  ['買菜', ['買菜', '菜市場', '市場', '全聯', '家樂福', '大潤發', '好市多', '美廉社', '超市', '青菜', '蔬菜', '高麗菜', '菠菜', '地瓜葉', '空心菜', '蔥', '蒜', '薑', '蘿蔔', '番茄', '馬鈴薯', '洋蔥', '香菇', '豆腐', '雞蛋', '蛋', '豬肉', '牛肉', '雞肉', '絞肉', '排骨', '肉', '魚', '蝦', '水果', '香蕉', '蘋果', '芭樂', '橘子', '米', '油', '醬油', '菜']],

var FILLERS = ['剛剛', '剛才', '方才', '今天', '昨天', '前天', '早上', '上午', '中午', '下午', '傍晚', '晚上', '現在', '那個', '這個', '然後', '還有', '總共', '一共', '大概', '差不多', '平分', '均分', '分攤', '出錢', '付錢', '付款', '刷卡', '現金', '買單', '請客', '塊錢', '日幣', '日圓', '日元', '台幣', '新台幣', '買了', '吃了', '喝了', '花了', '付了', '坐了', '搭了', '用了', '的錢', '一下',
  '共', '買', '吃', '喝', '花', '付', '坐', '搭', '去', '用', '幫', '替', '給', '送', '跟', '和', '與', '還', '的', '了', '是', '在', '有', '嗯', '啊', '喔', '哦', '耶', '啦', '吧', '呢', '要', '先', '再', '元', '塊', '錢', '円', '圓', '各', '都', '就', '也', '出', '請', '墊'];

function cleanItem(text) {
  var t = text;
  FILLERS.forEach(function (f) { t = t.split(f).join(' '); });
  t = t.replace(/[，,。．.！!？?、:：；;$＄\s]+/g, ' ').replace(/NT/gi, ' ').trim();

function isYes(t) { return /^(對|是|好|沒錯|正確|可以|OK|ok|嗯|恩|是的|對的|對啊|好啊|好的|沒問題|就這樣|對對|記吧|記起來)/.test(t.replace(/\s/g, '')); }

// 把一句話拆成記帳欄位；沒聽到的欄位是 null
function parseUtterance(text, members, owner, now) {
  now = now || new Date();
  var t = toHalfWidth(text).replace(/\s+/g, ' ').trim();
  var r = { amount: null, cur: null, item: null, cat: null, payer: null, consumers: null, when: null, raw: text };

  if (/新台幣|台幣|台币|NT/.test(t)) r.cur = 'TWD';

  var amts = findAmounts(t);

  if (amts.length) {

    // 把金額從句子裡挖掉（倒著挖，位置才不會跑掉）
    pick.slice().sort(function (a, b) { return b.start - a.start; }).forEach(function (a) {
      work = work.slice(0, a.start) + ' ' + work.slice(a.end);

  }

  // 時間
  var d = new Date(now.getTime());
  var dayShift = /前天/.test(t) ? -2 : /昨天|昨晚/.test(t) ? -1 : 0;
  var hour = null;
  if (/早上|上午|早餐/.test(t)) hour = 9;
  else if (/中午|午餐/.test(t)) hour = 12;
  else if (/下午/.test(t)) hour = 15;
  else if (/傍晚/.test(t)) hour = 17;
  else if (/晚上|晚餐|昨晚|宵夜/.test(t)) hour = 19;

    var before = work.slice(Math.max(0, p.start - 1), p.start);
    // 「阿姐買蛋糕」：名字後面直接接「買」，這個人就是付錢的人；「幫阿姐買」「跟阿姐買」不算

    if ((/^(先)?(付|出錢|出的|出|刷|墊|請客|請|買單)/.test(after) || buys) && p.name.charAt(0) !== '*') {

  var cons = [];

  people.forEach(function (p) {
    if (p === payerSpan) return;
    if (p.name === '*ALL*') { cons = all.slice(); return; }
    if (p.name === '*HOUSE*') { HOUSE.forEach(function (n) { if (all.indexOf(n) >= 0 && cons.indexOf(n) < 0) cons.push(n); }); return; }
    if (helpMode && p.self) {
      // 「我幫阿姐買」：我是付錢的人，不是用的人
      var after = work.slice(p.end, p.end + 2);
      if (/^(幫|替|給|送|買|先)/.test(after)) { if (!r.payer) r.payer = p.name; return; }
    }
    if (cons.indexOf(p.name) < 0) cons.push(p.name);
  });
  people.forEach(function (p) {
    if (p === payerSpan || p.self || p.name.charAt(0) === '*' || !owner) return;

  people.slice().sort(function (a, b) { return b.start - a.start; }).forEach(function (p) {
    itemText = itemText.slice(0, p.start) + ' ' + itemText.slice(p.end);
  });

}

// 最大餘數法平分（整數日圓，加總剛好等於總額）
function splitEven(amount, n) {
  var base = Math.floor(amount / n), rem = amount - base * n, out = [];

<script>
// ===== 畫面與對話流程 =====
(function () {
  var KEY = 'grocery-ledger-v1';

  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

    ]);
  }
  function fixSlot(slot) {
    if (slot === 'all') { st.draft = null; st.mode = 'idle'; bot('好，請整句重講一次。'); setChips([]); return; }
    var q = { amount: '多少錢？', item: '買了什麼？', consumers: '這筆是誰的？', payer: '誰付的錢？' }[slot];
    st.draft[slot] = null;
    ask(slot, q);
  }

  function commit() {
    var d = st.draft;
    var e = { id: Date.now().toString(36), when: d.when, amount: d.amount, cur: d.cur, item: d.item, cat: d.cat || '其他', payer: d.payer, consumers: d.consumers, raw: d.raws.join(' ／ '), by: S.owner };
    S.entries.push(e); save();
    st.draft = null; st.mode = 'idle';
    bot('記好了。');
    setChips([{ label: '取消剛剛這筆', value: e.id, kind: 'quiet', onPick: function (id) { removeEntry(id); bot('剛剛那筆刪掉了。'); setChips([]); } }]);
    renderLedger();
  }
  function cancelDraft() { st.draft = null; st.mode = 'idle'; bot('好，這筆不記了。'); setChips([]); }

  function removeEntry(id) {
    S.entries = S.entries.filter(function (e) { return e.id !== id; }); save(); renderLedger();
  }

  function userSays(text, fromButton) { bubble('me', text, fromButton ? 'tap' : ''); }

  function handle(text) {
    text = (text || '').trim();
    if (!text) return;
    userSays(text);
    var compact = text.replace(/\s/g, '');

    if (st.mode === 'confirm') {
      if (isNo(compact)) return fixMenu();
      if (isYes(compact)) return commit();
      var r = parseUtterance(text, S.members, S.owner);
      st.draft.raws.push(text);
      merge(st.draft, r);
      return nextStep();
    }

    if (st.mode === 'ask' || st.mode === 'fix') {
      if (/^(不記了|算了|取消)/.test(compact)) return cancelDraft();
      var slot = st.asking, r2 = parseUtterance(text, S.members, S.owner);
      st.draft.raws.push(text);
      if (slot === 'item' && !r2.item) r2.item = compact;
      if (slot === 'consumers' && !r2.consumers && /我|自己/.test(compact)) r2.consumers = [S.owner];
      if (slot === 'payer') {
        var pp = r2.payer || (r2.consumers && r2.consumers[0]);
        if (pp) { st.draft.payer = pp; return nextStep(); }
      }
      if (slot === 'cur') {
        if (/台/.test(compact)) { st.draft.cur = 'TWD'; return nextStep(); }
        if (/日/.test(compact)) { st.draft.cur = 'JPY'; return nextStep(); }
      }
      merge(st.draft, r2);
      if (!st.draft[slot]) {
        var again = { amount: '我沒聽到金額，請再說一次，例如「三百五」。', item: '請再說一次買了什麼，例如「青菜」。', consumers: '請再說一次是誰的，可以點下面的名字。', payer: '請點下面誰付的錢。', cur: '請點日幣或台幣。' }[slot];
        bot(again);
        return;
      }
      return nextStep();
    }

    // 待命中：先看是不是指令
    if (/(刪掉|刪除|取消|不要).*(剛剛|上一筆|那筆|剛才)/.test(compact) || /^(刪掉|取消)$/.test(compact)) {
      var last = S.entries[S.entries.length - 1];
      if (!last) { bot('目前沒有記帳。'); return; }
      bot('要刪掉「' + last.item + ' ' + fmt(last.amount, last.cur) + '」嗎？');
      setChips([{ label: '刪掉', value: last.id, kind: 'no', onPick: function (id) { userSays('刪掉', true); removeEntry(id); bot('刪掉了。'); setChips([]); } },
                { label: '不要刪', value: 0, kind: 'quiet', onPick: function () { userSays('不要刪', true); bot('好，留著。'); setChips([]); } }]);
      return;
    }
    if (/(花了多少|花多少|共多少|總共多少|用了多少)/.test(compact)) {
      var r3 = parseUtterance(text, S.members, S.owner);
      if (!r3.amount) { bot(todaySummary()); setChips([]); return; }
    }

    var r4 = parseUtterance(text, S.members, S.owner);
    if (!r4.amount && !r4.item && !r4.consumers) {
      bot('我沒聽懂。可以這樣說：「全聯買菜八百五」或「跟阿姨吃午餐六百，阿姨付的」。');
      return;
    }
    st.draft = { amount: null, cur: null, item: null, cat: null, payer: null, consumers: null, when: null, raws: [text] };
    merge(st.draft, r4);
    nextStep();
  }

  function todaySummary() {
    var today = new Date().toDateString(), me = S.owner, jp = 0, tw = 0;
    S.entries.forEach(function (e) {
      if (new Date(e.when).toDateString() !== today) return;
      var i = e.consumers.indexOf(me); if (i < 0) return;
      var share = splitEven(e.amount, e.consumers.length)[i];
      if (e.cur === 'JPY') jp += share; else tw += share;
    });
    if (!jp && !tw) return '今天還沒有' + me + '的花費。';
    return '今天' + me + '花了 ' + (tw ? fmt(tw, 'TWD') : '') + (jp && tw ? '，另外 ' : '') + (jp ? fmt(jp, 'JPY') : '') + '。';
  }

  // ---------- 語音輸入 ----------
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  // 語音輸入：整個頁面只用「同一個」語音辨識，不重複新開（iPhone 每新開一個可能就要再問一次權限）。
  // 自己計時：只要還有聽到聲音就繼續等；安靜超過設定的秒數才算說完。
  // iPhone 有時會自己提早停，這時用同一個辨識接著再聽（最多 3 次），前面聽到的字會留著。
  var rec = null, listening = false, live = null;
  var kept = '', current = '', silenceTimer = null, startedAt = 0, lastHeard = 0, stopping = false, hadError = false, restarts = 0;
  var MAX_MS = 40000, MAX_RESTARTS = 3;
  var mic = $('mic'), micLabel = $('micLabel');

  var micState = 'off', watchdog = null;
  function setMic(state) {
    // state: 'off' | 'prep' | 'ready' | 'hearing'
    micState = state;
    if (state !== 'prep') clearTimeout(watchdog);
    listening = state !== 'off';
    mic.classList.toggle('on', state === 'ready' || state === 'hearing');
    mic.classList.toggle('prep', state === 'prep');
    mic.setAttribute('aria-pressed', listening ? 'true' : 'false');
    micLabel.textContent = { off: '快速語音（有時不穩）', prep: '準備中…請稍等', ready: '請說話（說完再按一下）', hearing: '聽到了…說完再按一下' }[state];
  }
  function heardText() { return (kept + current).trim(); }
  function showLive() {
    var t = heardText();
    if (!t) return;
    if (!live) live = bubble('me', t, 'live'); else live.textContent = t;
    chat.scrollTop = chat.scrollHeight;
  }
  function armSilence() {
    clearTimeout(silenceTimer);
    var wait = heardText() ? S.pause * 1000 : Math.max(8000, S.pause * 1000); // 還沒開口前多等一點
    silenceTimer = setTimeout(finishListen, wait);
  }
  function finishListen() {
    if (!listening) return;
    stopping = true;
    clearTimeout(silenceTimer);
    try { rec.stop(); } catch (e) { endListen(); }
  }
  function endListen() {
    clearTimeout(silenceTimer);
    setMic('off');
    var t = heardText();
    if (live) { live.remove(); live = null; }
    kept = ''; current = '';
    if (t) handle(t);
    else if (!hadError) bot('快速語音沒有聽到。請改按紅色的「按這裡說話」，用鍵盤上的麥克風說。');
  }

  var ERR = {
    'not-allowed': '麥克風權限被拒絕了。請在 Safari 網址列左邊按「大小」→「網站設定」→ 麥克風選「允許」。',
    'service-not-allowed': 'iPhone 的語音辨識沒打開。請到「設定 → 一般 → 鍵盤」打開「啟用聽寫」，也確認「設定 → Siri」可以使用。',
    'network': '語音辨識需要網路，現在連不上。可以先在下面打字。',
    'audio-capture': '抓不到麥克風。可能有別的 APP（例如通話、錄音）正在用麥克風，關掉後再試。',
    'language-not-supported': '這支手機不支援國語語音辨識。'
  };

  function getRec() {
    if (rec) return rec;
    rec = new SR();
    rec.lang = 'zh-TW'; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 1;
    rec.onaudiostart = function () { if (listening && !heardText()) setMic('ready'); };
    rec.onstart = function () { if (listening && !heardText()) setMic('ready'); };
    rec.onspeechstart = function () { if (listening) setMic('hearing'); };
    rec.onresult = function (ev) {
      var t = '';
      for (var i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript;
      current = t;
      lastHeard = Date.now();
      setMic('hearing');
      showLive();
      armSilence();
    };
    rec.onerror = function (ev) {
      if (ev.error === 'no-speech' || ev.error === 'aborted') return; // 交給 onend 處理
      hadError = true; stopping = true;
      bot(ERR[ev.error] || ('語音出了問題（' + ev.error + '），請再按一次試試，或在下面打字。'));
    };
    rec.onend = function () {
      if (!listening) return;
      if (!stopping && restarts < MAX_RESTARTS && Date.now() - startedAt < MAX_MS) {
        kept = heardText() ? heardText() + ' ' : '';
        current = '';
        var quietFor = Date.now() - (lastHeard || startedAt);
        if (quietFor < S.pause * 1000 || !kept) {
          restarts++;
          try { rec.start(); return; } catch (e) {}
        }
      }
      endListen();
    };
    return rec;
  }

  function startListen() {
    if (!S.owner) { showOwner(); return; }
    if (!SR) {
      bot('這個瀏覽器不能用快速語音。請改按紅色的「按這裡說話」。');
      return;
    }
    if (listening) { finishListen(); return; } // 再按一次 = 說完了
    kept = ''; current = ''; live = null; stopping = false; hadError = false; restarts = 0;
    startedAt = Date.now(); lastHeard = 0;
    setMic('prep');
    clearTimeout(watchdog);
    watchdog = setTimeout(function () {
      if (micState !== 'prep') return;
      stopping = true; hadError = true;
      try { rec.abort(); } catch (e) {}
      setMic('off');
      bot('快速語音沒有開起來。請改按紅色的「按這裡說話」，用鍵盤上的麥克風說。');
    }, 5000);
    try { getRec().start(); armSilence(); }
    catch (e) {
      // 上一次還沒完全停下來：先停，再開
      try { rec.abort(); } catch (x) {}
      setTimeout(function () { try { rec.start(); armSilence(); } catch (x) { setMic('off'); bot('麥克風開不起來，請再按一次。'); } }, 300);
    }
  }
  mic.addEventListener('click', startListen);

  // ---------- 麥克風檢查（給遠端除錯用） ----------
  function runDiag() {
    var out = $('diag'), t0 = Date.now();
    out.hidden = false; out.textContent = '';
    function add(s) { out.textContent += s + '\n'; }
    function ms() { return ((Date.now() - t0) / 1000).toFixed(1) + '秒 '; }
    var ua = navigator.userAgent || '';
    var ios = (ua.match(/OS (\d+)_(\d+)/) || []);
    add('iOS 版本：' + (ios[1] ? ios[1] + '.' + ios[2] : '看不出來'));
    var app = /Line\//i.test(ua) ? 'LINE 內建瀏覽器' : /CriOS/.test(ua) ? 'Chrome' : /FxiOS/.test(ua) ? 'Firefox' : /FBAN|FBAV|Instagram/.test(ua) ? 'FB/IG 內建瀏覽器' : (/Safari/.test(ua) ? 'Safari' : '其他');
    add('瀏覽器：' + app + (navigator.standalone ? '（從主畫面打開）' : ''));
    add('支援語音辨識：' + (SR ? '是' : '否'));
    add('網址：' + location.protocol + '//' + location.host);
    add('網路：' + (navigator.onLine ? '有' : '沒有'));
    add('—— 第一步：開麥克風（請在跳出的視窗按允許）');
    var step2 = function () {
      if (!SR) { add('—— 這個瀏覽器不能語音辨識，檢查結束'); return; }
      add('—— 第二步：語音辨識測試，請現在說「測試一二三」');
      var r;
      try { r = new SR(); } catch (e) { add(ms() + '建立失敗：' + e.message); return; }
      r.lang = 'zh-TW'; r.interimResults = true; r.continuous = false;
      ['start', 'audiostart', 'soundstart', 'speechstart', 'speechend', 'audioend'].forEach(function (n) {
        r['on' + n] = function () { add(ms() + n); };
      });
      r.onresult = function (ev) { var s = ''; for (var i = 0; i < ev.results.length; i++) s += ev.results[i][0].transcript; add(ms() + '聽到：' + s); };
      r.onerror = function (ev) { add(ms() + '錯誤：' + ev.error + (ERR[ev.error] ? '\n  → ' + ERR[ev.error] : '')); };
      r.onend = function () { add(ms() + 'end（檢查結束，請截圖）'); };
      try { r.start(); add(ms() + '已呼叫開始'); } catch (e) { add(ms() + '開始失敗：' + e.message); }
      setTimeout(function () { try { r.stop(); } catch (e) {} }, 8000);
    };
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
        add(ms() + '麥克風：可以使用');
        s.getTracks().forEach(function (tr) { tr.stop(); });
        setTimeout(step2, 400);
      }, function (e) {
        add(ms() + '麥克風：不能用（' + e.name + '）');
        setTimeout(step2, 400);
      });
    } else { add('麥克風：這個瀏覽器不支援'); step2(); }
  }
  $('diagBtn').addEventListener('click', function () { if (listening) finishListen(); runDiag(); });

  // ---------- 主要方式：iPhone 鍵盤的聽寫 ----------
  function openCompose() {
    if (!S.owner) { showOwner(); return; }
    if (listening) finishListen();
    $('compose').hidden = false; $('talkBtn').hidden = true; $('mic').hidden = true;
    $('typeBox').focus(); // 一定要在按鈕的點擊裡呼叫，iPhone 才會跳出鍵盤
    fitViewport();
  }
  function closeCompose() {
    $('compose').hidden = true; $('talkBtn').hidden = false; $('mic').hidden = false;
    $('typeBox').blur();
  }
  function sendCompose() {
    var v = $('typeBox').value.trim();
    if (!v) { $('typeBox').focus(); return; }
    $('typeBox').value = '';
    handle(v);
    $('typeBox').focus(); // 鍵盤留著，機器人追問時可以直接再說
  }
  $('talkBtn').addEventListener('click', openCompose);
  $('composeCancel').addEventListener('click', closeCompose);
  $('compose').addEventListener('submit', function (ev) { ev.preventDefault(); sendCompose(); });
  $('typeBox').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); sendCompose(); }
  });
  // 點選按鈕回答時，把鍵盤收起來
  chips.addEventListener('click', function () { if (!$('compose').hidden && !$('typeBox').value.trim()) closeCompose(); });

  // 鍵盤跳出來時，讓整個畫面縮到鍵盤上方，輸入框才不會被擋住
  function fitViewport() {
    var vv = window.visualViewport;
    if (!vv) return;
    document.documentElement.style.height = vv.height + 'px';
    document.body.style.height = vv.height + 'px';
    window.scrollTo(0, 0);
    chat.scrollTop = chat.scrollHeight;
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitViewport);
    window.visualViewport.addEventListener('scroll', function () { window.scrollTo(0, 0); });
  }

  // ---------- 這支手機是誰的 ----------
  function showOwner() {
    var box = $('ownerList'); box.innerHTML = '';
    names().forEach(function (n) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'owner-btn' + (S.owner === n ? ' on' : ''); b.textContent = n;
      b.addEventListener('click', function () {
        S.owner = n; save(); $('ownerSheet').hidden = true; $('ownerName').textContent = n;
        renderLedger();
        if (!chat.children.length) greet();
      });
      box.appendChild(b);
    });
    $('ownerSheet').hidden = false;
  }
  function greet() {
    bot(S.owner + '您好。按下面紅色的「按這裡說話」，再按鍵盤上的麥克風就能用說的，例如「全聯買菜八百五」。沒說是誰的，就記在阿母身上。', false);
  }
  $('ownerBtn').addEventListener('click', showOwner);

  // ---------- 帳本 ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function balances(cur, entries) {
    var b = {}; names().forEach(function (n) { b[n] = { paid: 0, used: 0 }; });
    (entries || S.entries).filter(function (e) { return (e.cur || 'TWD') === cur; }).forEach(function (e) {
      if (!b[e.payer]) b[e.payer] = { paid: 0, used: 0 };
      b[e.payer].paid += e.amount;
      var sh = splitEven(e.amount, e.consumers.length);
      e.consumers.forEach(function (c, i) { if (!b[c]) b[c] = { paid: 0, used: 0 }; b[c].used += sh[i]; });
    });
    return b;
  }
  // 結算：每一筆都是「用的人欠付錢的人」，同兩個人之間互相抵銷。這樣家人看得懂是哪幾筆來的。
  function settle(cur, entries) {
    var owe = {};
    (entries || S.entries).filter(function (e) { return (e.cur || 'TWD') === cur; }).forEach(function (e) {
      var sh = splitEven(e.amount, e.consumers.length);
      e.consumers.forEach(function (c, i) {
        if (c === e.payer) return;
        var k = c + '>' + e.payer; owe[k] = (owe[k] || 0) + sh[i];
      });
    });
    var out = [], done = {};
    Object.keys(owe).forEach(function (k) {
      if (done[k]) return;
      var p = k.split('>'), back = p[1] + '>' + p[0];
      done[k] = done[back] = 1;
      var net = owe[k] - (owe[back] || 0);
      if (net > 0) out.push({ from: p[0], to: p[1], v: net });
      else if (net < 0) out.push({ from: p[1], to: p[0], v: -net });
    });
    var order = names();
    out.sort(function (x, y) { return order.indexOf(x.from) - order.indexOf(y.from) || order.indexOf(x.to) - order.indexOf(y.to); });
    return out;
  }

  var editingId = null;
  var CAT_LIST = ['飲食', '買菜', '購物', '交通', 'MOMO', '其他'];

  function pad(n) { return ('0' + n).slice(-2); }
  function toLocalInput(iso) { var d = new Date(iso); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  // 搜尋：品項、分類、人名、金額、日期（例如 12/28、12月28日）、原本說的話都可以找
  function matches(e, q) {
    if (!q) return true;
    var d = new Date(e.when);
    var hay = [e.item, e.cat, e.payer + '付', whoText(e.consumers), e.consumers.join(' '), e.raw,
      String(e.amount), e.amount.toLocaleString('en-US'), e.cur === 'JPY' ? '日幣 日圓' : '台幣',
      (d.getMonth() + 1) + '/' + d.getDate(), (d.getMonth() + 1) + '月' + d.getDate() + '日'].join(' ');
    return q.split(/\s+/).filter(Boolean).every(function (w) { return hay.indexOf(w) >= 0; });
  }

  function renderLedger() {
    var list = $('ledgerList'); list.innerHTML = '';
    var q = ($('searchBox').value || '').trim();
    var sorted = S.entries.slice().sort(function (a, b) { return b.when < a.when ? -1 : 1; });
    var shown = sorted.filter(function (e) { return matches(e, q) || e.id === editingId; });
    $('countBadge').textContent = S.entries.length ? S.entries.length : '';
    $('searchClear').hidden = !q;
    if (!sorted.length) {
      list.innerHTML = '<p class="empty">還沒有記帳。回到「說話記帳」，按紅色按鈕說一句話就會出現在這裡。</p>';
    } else if (!shown.length) {
      list.innerHTML = '<p class="empty">找不到「' + esc(q) + '」。可以試試品名、人名、金額或日期（例如 12/28）。</p>';
    }
    if (q && shown.length) {
      var jp = 0, tw = 0;
      shown.forEach(function (e) { if (e.cur === 'JPY') jp += e.amount; else tw += e.amount; });
      var p = document.createElement('p'); p.className = 'found';
      p.textContent = '找到 ' + shown.length + ' 筆，共 ' + [tw ? fmt(tw, 'TWD') : '', jp ? fmt(jp, 'JPY') : ''].filter(Boolean).join('、');
      list.appendChild(p);
    }
    var lastDay = '';
    shown.forEach(function (e) {
      var d = new Date(e.when), day = (d.getMonth() + 1) + '月' + d.getDate() + '日';
      if (day !== lastDay) { var h = document.createElement('h3'); h.className = 'day'; h.textContent = day; list.appendChild(h); lastDay = day; }
      list.appendChild(e.id === editingId ? editRow(e) : viewRow(e, d));
    });
    renderSummary();
  }

  function viewRow(e, d) {
    var row = document.createElement('div'); row.className = 'entry';
    var hh = pad(d.getHours()) + ':' + pad(d.getMinutes());
    row.innerHTML = '<div class="e-main"><div class="e-item"><span class="cat sm">' + esc(e.cat) + '</span>' + esc(e.item) + '</div>' +
      '<div class="e-meta">' + hh + ' · ' + esc(whoText(e.consumers)) + ' · ' + esc(e.payer) + '付</div></div>' +
      '<div class="e-amt">' + esc(fmt(e.amount, e.cur)) + '</div>' +
      '<div class="e-acts"><button type="button" class="e-edit">修改</button><button type="button" class="e-del">刪除</button></div>';
    row.querySelector('.e-edit').addEventListener('click', function () { editingId = e.id; renderLedger(); });
    var del = row.querySelector('.e-del');
    del.addEventListener('click', function () {
      if (del.dataset.armed) { removeEntry(e.id); return; }
      del.dataset.armed = '1'; del.textContent = '確定刪？'; del.classList.add('armed');
      setTimeout(function () { if (del.isConnected) { delete del.dataset.armed; del.textContent = '刪除'; del.classList.remove('armed'); } }, 3000);
    });
    return row;
  }

  function editRow(e) {
    var f = document.createElement('form'); f.className = 'entry editing'; f.setAttribute('autocomplete', 'off');
    var pid = 'ed-' + e.id;
    var catOpts = CAT_LIST.map(function (c) { return '<option' + (c === e.cat ? ' selected' : '') + '>' + c + '</option>'; }).join('');
    var payOpts = names().map(function (n) { return '<option' + (n === e.payer ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('');
    var people = names().map(function (n) {
      return '<button type="button" class="pick' + (e.consumers.indexOf(n) >= 0 ? ' on' : '') + '" data-name="' + esc(n) + '" aria-pressed="' + (e.consumers.indexOf(n) >= 0) + '">' + esc(n) + '</button>';
    }).join('');
    f.innerHTML =
      '<label class="fld" for="' + pid + '-item"><span>買什麼</span><input id="' + pid + '-item" name="itemName" value="' + esc(e.item) + '" required></label>' +
      '<div class="fld-row">' +
        '<label class="fld" for="' + pid + '-amt"><span>金額</span><input id="' + pid + '-amt" name="amount" type="number" inputmode="numeric" min="1" step="1" value="' + e.amount + '" required></label>' +
        '<label class="fld narrow" for="' + pid + '-cur"><span>幣別</span><select id="' + pid + '-cur" name="cur"><option value="TWD"' + (e.cur !== 'JPY' ? ' selected' : '') + '>台幣</option><option value="JPY"' + (e.cur === 'JPY' ? ' selected' : '') + '>日幣</option></select></label>' +
      '</div>' +
      '<div class="fld"><span>誰的（可以選好幾個，平分）</span><div class="picks">' + people + '</div></div>' +
      '<div class="fld-row">' +
        '<label class="fld" for="' + pid + '-pay"><span>誰付錢</span><select id="' + pid + '-pay" name="payer">' + payOpts + '</select></label>' +
        '<label class="fld" for="' + pid + '-cat"><span>分類</span><select id="' + pid + '-cat" name="cat">' + catOpts + '</select></label>' +
      '</div>' +
      '<label class="fld" for="' + pid + '-when"><span>時間</span><input id="' + pid + '-when" name="when" type="datetime-local" value="' + toLocalInput(e.when) + '" required></label>' +
      '<p class="ed-err" hidden></p>' +
      '<div class="ed-acts"><button type="submit" class="ed-save">儲存</button><button type="button" class="ed-cancel">取消</button></div>';
    Array.prototype.forEach.call(f.querySelectorAll('.pick'), function (b) {
      b.addEventListener('click', function () {
        var on = !b.classList.contains('on');
        b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    });
    f.querySelector('.ed-cancel').addEventListener('click', function () { editingId = null; renderLedger(); });
    f.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var err = f.querySelector('.ed-err');
      var item = f.querySelector('[name=itemName]').value.trim();
      var amount = parseInt(f.querySelector('[name=amount]').value, 10);
      var cons = Array.prototype.filter.call(f.querySelectorAll('.pick'), function (b) { return b.classList.contains('on'); }).map(function (b) { return b.dataset.name; });
      var when = new Date(f.querySelector('[name=when]').value);
      var problem = !item ? '請填買了什麼。' : !(amount > 0) ? '金額要是大於 0 的整數。' : !cons.length ? '請至少選一個人。' : isNaN(when) ? '請填時間。' : '';
      if (problem) { err.textContent = problem; err.hidden = false; return; }
      e.item = item; e.amount = amount; e.cur = f.querySelector('[name=cur]').value; e.consumers = cons;
      e.payer = f.querySelector('[name=payer]').value; e.cat = f.querySelector('[name=cat]').value; e.when = when.toISOString();
      e.edited = new Date().toISOString();
      save(); editingId = null; renderLedger(); flash('改好了。');
    });
    setTimeout(function () { try { f.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (x) {} }, 0);
    return f;
  }

  function renderSummary() {
    var sum = $('summary'); sum.innerHTML = '';
    ['TWD', 'JPY'].forEach(function (cur) {
      if (!S.entries.some(function (e) { return (e.cur || 'TWD') === cur; })) return;
      var b = balances(cur), t = settle(cur);
      var html = '<div class="sum-block"><h3>' + (cur === 'JPY' ? '日幣' : '台幣') + '</h3><table><thead><tr><th>人</th><th>花費</th><th>付出</th></tr></thead><tbody>';
      names().forEach(function (n) { html += '<tr><td>' + esc(n) + '</td><td>' + b[n].used.toLocaleString('en-US') + '</td><td>' + b[n].paid.toLocaleString('en-US') + '</td></tr>'; });
      html += '</tbody></table>';
      html += t.length ? '<ul class="settle">' + t.map(function (x) { return '<li><b>' + esc(x.from) + '</b> 要給 <b>' + esc(x.to) + '</b> ' + esc(fmt(x.v, cur)) + '</li>'; }).join('') + '</ul>' : '<p class="even">大家剛好扯平。</p>';
      sum.innerHTML += html + '</div>';
    });
  }

  // ---------- 傳到 LINE：選區間 ----------
  var range = { kind: 'all', ym: null, from: '', to: '' };
  function ymOf(iso) { var d = new Date(iso); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  function dateOf(iso) { var d = new Date(iso); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function months() {
    var seen = {};
    S.entries.forEach(function (e) { seen[ymOf(e.when)] = 1; });
    return Object.keys(seen).sort().reverse();
  }
  function ymLabel(ym) {
    var y = +ym.slice(0, 4), m = +ym.slice(5);
    return (y === new Date().getFullYear() ? '' : y + '年') + m + '月';
  }
  function inRange(e) {
    if (range.kind === 'month') return ymOf(e.when) === range.ym;
    if (range.kind === 'custom') {
      var d = dateOf(e.when);
      return (!range.from || d >= range.from) && (!range.to || d <= range.to);
    }
    return true;
  }
  function rangeLabel() {
    if (range.kind === 'month') return ymLabel(range.ym);
    if (range.kind === 'custom') {
      var f = range.from ? range.from.slice(5).replace('-', '/') : '最早', t = range.to ? range.to.slice(5).replace('-', '/') : '最近';
      return f + '～' + t;
    }
    return '全部';
  }

  function exportText() {
    var list = S.entries.filter(inRange).sort(function (a, b) { return a.when < b.when ? -1 : 1; });
    var lines = ['【' + (S.owner || '') + '的買菜記帳】' + rangeLabel()];
    if (!list.length) { lines.push('這段時間沒有記帳。'); return lines.join('\n'); }
    list.forEach(function (e) {
      var d = new Date(e.when);
      lines.push((d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + '｜' + e.item + '｜' + fmt(e.amount, e.cur) + '｜' + whoText(e.consumers) + '｜' + e.payer + '付');
    });
    ['TWD', 'JPY'].forEach(function (cur) {
      var sub = list.filter(function (e) { return (e.cur || 'TWD') === cur; });
      if (!sub.length) return;
      var total = sub.reduce(function (s, e) { return s + e.amount; }, 0);
      var b = balances(cur, sub), t = settle(cur, sub);
      lines.push('', '━━━━━━━━━━');
      lines.push('總花費' + (cur === 'JPY' ? '（日幣）' : '') + '：' + fmt(total, cur) + '（' + sub.length + ' 筆）');
      var used = names().filter(function (n) { return b[n].used; }).map(function (n) { return n + ' ' + b[n].used.toLocaleString('en-US'); });
      if (used.length) lines.push('每人花費：' + used.join('、'));
      lines.push('分帳結論：');
      if (t.length) t.forEach(function (x) { lines.push('・' + x.from + '要給' + x.to + ' ' + fmt(x.v, cur)); });
      else lines.push('・大家剛好扯平，不用互相給錢');
    });
    return lines.join('\n');
  }

  function renderExport() {
    var box = $('rangeList'); box.innerHTML = '';
    var opts = [{ kind: 'all', label: '全部' }].concat(months().map(function (ym) { return { kind: 'month', ym: ym, label: ymLabel(ym) }; })).concat([{ kind: 'custom', label: '自己選日期' }]);
    opts.forEach(function (o) {
      var b = document.createElement('button'); b.type = 'button';
      var on = range.kind === o.kind && (o.kind !== 'month' || range.ym === o.ym);
      b.className = 'chip' + (on ? ' on' : ''); b.textContent = o.label; b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.addEventListener('click', function () { range.kind = o.kind; range.ym = o.ym || null; renderExport(); });
      box.appendChild(b);
    });
    $('customRange').hidden = range.kind !== 'custom';
    $('exportPreview').textContent = exportText();
  }
  $('rangeFrom').addEventListener('change', function () { range.from = $('rangeFrom').value; renderExport(); });
  $('rangeTo').addEventListener('change', function () { range.to = $('rangeTo').value; renderExport(); });

  $('shareBtn').addEventListener('click', function () {
    if (!S.entries.length) { flash('還沒有記帳可以傳。'); return; }
    var m = months();
    if (range.kind === 'month' && m.indexOf(range.ym) < 0) range.kind = 'all';
    renderExport();
    $('exportSheet').hidden = false;
  });
  $('exportCancel').addEventListener('click', function () { $('exportSheet').hidden = true; });
  $('exportSend').addEventListener('click', function () {
    var text = exportText();
    if (navigator.share) {
      navigator.share({ title: '買菜記帳', text: text }).then(function () { $('exportSheet').hidden = true; }, function () {});
      return;
    }
    $('exportSheet').hidden = true;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function () { flash('已複製，貼到 LINE 就可以傳出去。'); }, function () { showCopyBox(text); });
    } else showCopyBox(text);
  });
  function showCopyBox(text) { var t = $('copyBox'); t.hidden = false; t.value = text; t.select(); flash('請長按上面的文字，選「拷貝」。'); }
  function flash(msg) { var f = $('flash'); f.textContent = msg; f.hidden = false; clearTimeout(flash.t); flash.t = setTimeout(function () { f.hidden = true; }, 3500); }

  // ---------- 分頁 ----------
  function tab(which) {
    ['talk', 'book'].forEach(function (w) {
      $('view-' + w).hidden = w !== which;
      $('tab-' + w).setAttribute('aria-selected', w === which ? 'true' : 'false');
    });
    if (which === 'book') renderLedger();
  }
  $('tab-talk').addEventListener('click', function () { tab('talk'); });
  $('tab-book').addEventListener('click', function () { tab('book'); });

  $('pause').value = String(S.pause);
  $('pause').addEventListener('change', function () { S.pause = parseFloat($('pause').value); save(); flash('好，停 ' + S.pause + ' 秒才算說完。'); });

  $('searchBox').addEventListener('input', function () { editingId = null; renderLedger(); });
  $('searchClear').addEventListener('click', function () { $('searchBox').value = ''; renderLedger(); $('searchBox').focus(); });

  // 啟動
  renderLedger();
  if (S.owner) { $('ownerName').textContent = S.owner; greet(); } else showOwner();
})();

</script>
</body>
</html>
